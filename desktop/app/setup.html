<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Taverna na Combie</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src https: http:; img-src 'self' data:">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #12062a; color: #f3e8ff; font: 18px/1.4 Consolas, monospace; }
  .card { width: min(520px, 92vw); background: #241048; border: 4px solid #6a2fc0; box-shadow: 8px 8px 0 #07020f; padding: 26px; }
  h1 { margin: 0 0 12px; font-size: 22px; color: #d68cff; letter-spacing: 2px; text-align: center; }
  p { color: #b9a3d6; }
  .err { background: rgba(255,77,109,.12); border: 3px solid #ff4d6d; color: #ffb3c1; padding: 8px 12px; margin-bottom: 14px; }
  input { width: 100%; box-sizing: border-box; padding: 10px; font: inherit; background: #07020f; color: #f3e8ff; border: 3px solid #3d1b72; margin: 6px 0 16px; }
  button { width: 100%; padding: 14px; font: bold 16px Consolas, monospace; letter-spacing: 1px; color: #fff; background: #b026ff; border: 3px solid #d68cff; box-shadow: 4px 4px 0 #07020f; cursor: pointer; }
  button:disabled { opacity: .6; }
  .hidden { display: none; }
  .titlebar { position: fixed; top: 0; left: 0; right: 0; height: 40px; display: flex; align-items: center; padding: 0 6px 0 14px;
    background: #12062a; border-bottom: 3px solid #6a2fc0; -webkit-app-region: drag; color: #d68cff; font-weight: bold; letter-spacing: 2px; font-size: 13px; }
  .titlebar span { flex: 1; }
  .titlebar button { -webkit-app-region: no-drag; width: 36px; height: 28px; margin-left: 6px; padding: 0; box-shadow: none; font-size: 14px;
    background: #07020f; border: 2px solid #3d1b72; color: #b9a3d6; }
  .titlebar button:hover { border-color: #d68cff; color: #fff; }
  .titlebar button.x:hover { background: #ff4d6d; border-color: #ff4d6d; }
</style>
</head>
<body>
<div class="titlebar"><span>TAVERNA NA COMBIE</span><button id="wMin" title="Minimizar">_</button><button id="wMax" title="Maximizar">□</button><button id="wClose" class="x" title="Fechar">✕</button></div>
<div class="card">
  <h1>TAVERNA NA COMBIE</h1>
  <div class="err hidden" id="err"></div>
  <p id="intro">Não consegui abrir o site. Verifique sua internet e tente de novo.</p>
  <label>Endereço do site<input id="url" placeholder="https://tavernanacombie.win" autocomplete="off"></label>
  <button id="go">▶ TENTAR DE NOVO</button>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const w = window.tavernaApp.windowControls;
  if (w) { $('wMin').onclick = w.minimize; $('wMax').onclick = w.toggleMaximize; $('wClose').onclick = w.close; }
  const showErr = (m) => { $('err').textContent = m; $('err').classList.remove('hidden'); };
  window.tavernaApp.getServer().then((u) => { $('url').value = u || 'https://tavernanacombie.win'; });
  $('go').onclick = async () => {
    let url = $('url').value.trim().replace(/\/+$/, '');
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    $('go').disabled = true; $('go').textContent = 'CONECTANDO…';
    try {
      const c = await (await fetch(url + '/config', { cache: 'no-store' })).json();
      if (!c.iceServers) throw new Error();
      await window.tavernaApp.setServer(url);
    } catch {
      showErr('Sem resposta de ' + url + '. Confira sua conexão.');
      $('go').disabled = false; $('go').textContent = '▶ TENTAR DE NOVO';
    }
  };
</script>
</body>
</html>
